services:
  # Service 1
  catalog-service:
    build: ./services/catalog-service
    container_name: catalog-service
    ports:
      - "8001:8080"
    networks:
      - backend-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # Service 2
  user-service:
    build: ./services/user-service
    container_name: user-service
    ports:
      - "8002:8080"
    networks:
      - backend-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # Service 3
  ingest-service:
    build: ./services/ingest-service
    container_name: ingest-service
    ports:
      - "8003:8080"
    networks:
      - backend-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  #postgres database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - backend-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  postgres_data:

networks:
  backend-network:
    driver: bridge